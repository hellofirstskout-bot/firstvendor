<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>FirstVendor — Firstskout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --acc:#e8386d;--acc2:#c42d58;--acc-rgb:232,56,109;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'DM Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#080810;
  --surf:rgba(255,255,255,.04);
  --surf-solid:#12121c;
  --surf2:rgba(255,255,255,.06);
  --surf3:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.05);
  --glass-border:rgba(255,255,255,.1);
  --glass-border2:rgba(255,255,255,.16);
  --bdr:rgba(255,255,255,.07);
  --bdr2:rgba(255,255,255,.13);
  --t1:#f0eef8;--t2:#9895a8;--t3:#55535f;--t4:#2e2c36;
  --inp-bg:rgba(255,255,255,.06);
  --shadow:0 8px 32px rgba(0,0,0,.6),0 0 0 0.5px rgba(255,255,255,.08);
  --glow:0 0 40px rgba(232,56,109,.15);
  --sidebar-bg:rgba(8,8,16,.95);
  --noise:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}
[data-theme="light"]{
  --bg:#eeedf8;
  --surf:rgba(255,255,255,.7);
  --surf-solid:#ffffff;
  --surf2:rgba(255,255,255,.5);
  --surf3:rgba(255,255,255,.4);
  --glass:rgba(255,255,255,.6);
  --glass-border:rgba(255,255,255,.8);
  --glass-border2:rgba(0,0,0,.1);
  --bdr:rgba(0,0,0,.06);
  --bdr2:rgba(0,0,0,.12);
  --t1:#1a1828;--t2:#6a6880;--t3:#a8a6b8;--t4:#d8d6e8;
  --inp-bg:rgba(255,255,255,.8);
  --shadow:0 8px 32px rgba(0,0,0,.1),0 0 0 0.5px rgba(0,0,0,.06);
  --glow:0 0 40px rgba(232,56,109,.08);
  --sidebar-bg:rgba(20,18,36,.97);
  --noise:none;
}
html{height:100%;overflow-x:hidden}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--t1);
  min-height:100vh;min-height:100dvh;
  transition:background .3s,color .3s;
}
[data-theme="dark"] body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%,rgba(var(--acc-rgb),.08) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 80%,rgba(100,80,255,.06) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}
button,input,select{font-family:var(--font)}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{position:relative;z-index:1}

/* ── GLASS MIXIN ── */
.glass{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:0.5px solid var(--glass-border);
}
.glass-card{
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:0.5px solid var(--glass-border);
  border-radius:16px;
  box-shadow:var(--shadow);
}

/* ══════════════════════════════
   SPLASH / HELLO ANIMATION
══════════════════════════════ */
.splash{
  position:fixed;inset:0;z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);
  gap:0;
  animation:splashFadeOut .5s ease .5s forwards;
  animation-play-state:paused;
}
.splash.done{animation-play-state:running}
.splash-logo{
  display:flex;align-items:center;gap:12px;margin-bottom:40px;
  opacity:0;animation:fadeUp .5s ease .1s forwards;
}
.splash-logo-mark{
  width:48px;height:48px;border-radius:14px;
  background:var(--acc);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;
  box-shadow:0 0 30px rgba(var(--acc-rgb),.4);
}
.splash-logo-name{font-size:24px;font-weight:800;letter-spacing:-.02em}
.splash-logo-name span{color:var(--acc)}
.splash-hello{
  height:60px;overflow:hidden;position:relative;width:300px;text-align:center;
}
.splash-word{
  position:absolute;left:0;right:0;
  font-size:28px;font-weight:700;letter-spacing:-.01em;color:var(--t1);
  opacity:0;transform:translateY(30px);
  transition:opacity .3s ease,transform .3s ease;
}
.splash-word.visible{opacity:1;transform:translateY(0)}
.splash-word.exit{opacity:0;transform:translateY(-30px)}
.splash-sub{
  font-size:13px;color:var(--t3);margin-top:16px;font-family:var(--mono);
  opacity:0;animation:fadeUp .4s ease .3s forwards;
}
.splash-progress{
  width:120px;height:2px;background:var(--bdr2);border-radius:2px;
  margin-top:32px;overflow:hidden;
  opacity:0;animation:fadeUp .4s ease .4s forwards;
}
.splash-progress-bar{
  height:100%;background:var(--acc);border-radius:2px;
  width:0%;transition:width .1s linear;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashFadeOut{to{opacity:0;pointer-events:none;visibility:hidden}}

/* ══════════════════════════════
   BROWSER FOOTER
══════════════════════════════ */
.browser-footer{
  position:fixed;bottom:0;left:0;right:0;height:30px;
  background:linear-gradient(90deg,#c42d58,var(--acc),#ff6b9d);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#fff;letter-spacing:.06em;z-index:999;gap:6px;
}

/* ══════════════════════════════
   LOGIN
══════════════════════════════ */
.login-page{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px 60px;position:relative;overflow:hidden;
}
.login-orb1{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.12),transparent 70%);top:-100px;left:-100px;pointer-events:none}
.login-orb2{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(100,80,255,.08),transparent 70%);bottom:-50px;right:-50px;pointer-events:none}
.login-card{
  width:100%;max-width:400px;
  background:var(--glass);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:0.5px solid var(--glass-border2);
  border-radius:24px;padding:36px 32px 32px;
  box-shadow:var(--shadow),var(--glow);
  position:relative;z-index:1;
}
[data-theme="dark"] .login-card::before{
  content:'';position:absolute;inset:0;border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
  pointer-events:none;
}
.login-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.login-logo-mark{
  width:38px;height:38px;border-radius:11px;background:var(--acc);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;
  box-shadow:0 4px 16px rgba(var(--acc-rgb),.4);
}
.login-brand-name{font-size:20px;font-weight:800;letter-spacing:-.02em}
.login-brand-name span{color:var(--acc)}
.login-heading{font-size:16px;font-weight:700;margin-bottom:4px;text-align:center}
.login-sub{font-size:13px;color:var(--t2);text-align:center;margin-bottom:24px;line-height:1.5}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:6px;display:block}
.form-inp{
  width:100%;background:var(--inp-bg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:0.5px solid var(--bdr2);border-radius:11px;
  padding:12px 14px;font-size:14px;color:var(--t1);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.form-inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.15)}
.form-inp::placeholder{color:var(--t3)}
.login-btn{
  width:100%;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border:none;border-radius:11px;padding:14px;
  font-size:14px;font-weight:700;color:#fff;margin-top:6px;
  transition:opacity .15s,transform .1s;letter-spacing:.01em;
  box-shadow:0 4px 20px rgba(var(--acc-rgb),.35);
}
.login-btn:hover{opacity:.9}
.login-btn:active{transform:scale(.98)}
.login-err{font-size:12px;color:var(--acc);text-align:center;margin-top:8px;font-family:var(--mono)}
.login-footer{display:flex;align-items:center;justify-content:center;margin-top:20px}
.theme-pill{
  background:var(--surf2);backdrop-filter:blur(10px);
  border:0.5px solid var(--bdr);border-radius:20px;
  padding:6px 14px;font-size:11px;color:var(--t2);
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.theme-pill:hover{color:var(--t1);border-color:var(--bdr2)}
.theme-pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

/* ══════════════════════════════
   DASHBOARD LAYOUT
══════════════════════════════ */
.app{display:flex;min-height:100vh;min-height:100dvh;padding-bottom:30px}

/* SIDEBAR */
.sidebar{
  width:220px;flex-shrink:0;
  background:var(--sidebar-bg);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-right:0.5px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;
  position:fixed;top:0;bottom:30px;left:0;z-index:40;
}
.sidebar-brand{
  padding:20px 18px 16px;border-bottom:0.5px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:10px;
}
.sidebar-logo-mark{
  width:30px;height:30px;border-radius:8px;background:var(--acc);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;flex-shrink:0;
  box-shadow:0 2px 10px rgba(var(--acc-rgb),.4);
}
.sidebar-brand-name{font-size:15px;font-weight:800;letter-spacing:-.02em;color:#fff}
.sidebar-brand-name span{color:var(--acc)}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;scrollbar-width:none}
.sidebar-nav::-webkit-scrollbar{display:none}
.nav-section-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.2);padding:8px 8px 6px;margin-top:4px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:9px;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.45);transition:all .15s;margin-bottom:2px;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.nav-item.active{
  background:rgba(var(--acc-rgb),.15);color:#fff;
  border:0.5px solid rgba(var(--acc-rgb),.2);
}
.nav-item.active .nav-svg{color:var(--acc)}
.nav-svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.sidebar-footer{padding:12px 10px;border-top:0.5px solid rgba(255,255,255,.06)}
.sidebar-user{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:9px;background:rgba(255,255,255,.04);
  border:0.5px solid rgba(255,255,255,.06);
}
.sidebar-av{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;font-family:var(--mono);
}
.sidebar-uinfo{flex:1;min-width:0}
.sidebar-uname{font-size:12px;font-weight:600;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-uid{font-size:10px;color:rgba(255,255,255,.3);font-family:var(--mono)}
.sidebar-signout{background:none;border:none;color:rgba(255,255,255,.25);padding:4px;transition:color .15s;display:flex;align-items:center}
.sidebar-signout:hover{color:rgba(255,255,255,.6)}
.sidebar-signout svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* MAIN */
.main{flex:1;margin-left:220px;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:52px;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:0.5px solid var(--bdr);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;
}
.topbar-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.topbar-r{display:flex;align-items:center;gap:10px}

/* SYNC WIDGET */
.sync-widget{
  display:flex;align-items:center;gap:8px;
  background:var(--surf2);backdrop-filter:blur(10px);
  border:0.5px solid var(--bdr);border-radius:20px;padding:6px 12px 6px 10px;
  cursor:pointer;transition:border-color .15s;
}
.sync-widget:hover{border-color:var(--bdr2)}
.sync-ring{
  width:20px;height:20px;border-radius:50%;
  border:1.5px solid rgba(76,207,80,.2);
  border-top-color:#4caf50;
  animation:spin 1.5s linear infinite;flex-shrink:0;
}
.sync-ring.idle{
  animation:none;
  border:1.5px solid rgba(76,207,80,.25);
  position:relative;display:flex;align-items:center;justify-content:center;
}
.sync-ring.idle::after{
  content:'';width:8px;height:8px;border-radius:50%;
  background:#4caf50;box-shadow:0 0 6px #4caf50;
}
.sync-text{font-size:10px;font-family:var(--mono);color:var(--t2)}
@keyframes spin{to{transform:rotate(360deg)}}
.page-content{padding:20px 24px;flex:1}

/* ══════════════════════════════
   MOBILE
══════════════════════════════ */
.mobile-topbar{
  display:none;height:50px;
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:0.5px solid var(--bdr);
  padding:0 14px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;
}
.mobile-brand{display:flex;align-items:center;gap:8px}
.mobile-logo-mark{width:26px;height:26px;border-radius:7px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;box-shadow:0 2px 8px rgba(var(--acc-rgb),.35)}
.mobile-brand-name{font-size:14px;font-weight:800;letter-spacing:-.02em}
.mobile-brand-name span{color:var(--acc)}
.mobile-topbar-r{display:flex;align-items:center;gap:8px}
.mobile-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;font-family:var(--mono)}

.mobile-bottom-nav{
  display:none;position:fixed;bottom:30px;left:0;right:0;
  background:var(--glass);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:0.5px solid var(--bdr);z-index:40;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.mobile-nav-inner{display:flex;align-items:center;height:54px}
.mob-nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;color:var(--t3);
  font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  transition:color .15s;padding:4px;
}
.mob-nav-btn.active{color:var(--acc)}
.mob-nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}

/* ══════════════════════════════
   DASHBOARD
══════════════════════════════ */
.dash-greeting{margin-bottom:20px}
.dash-greeting h2{font-size:clamp(18px,4vw,22px);font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.dash-greeting p{font-size:13px;color:var(--t2)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:0.5px solid var(--glass-border);
  border-radius:16px;padding:16px;
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.stat-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
[data-theme="dark"] .stat-card::before{
  content:'';position:absolute;top:0;right:0;
  width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.04),transparent);
}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.stat-svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;opacity:.6;flex-shrink:0}
.stat-val{font-size:clamp(22px,4vw,26px);font-weight:800;font-family:var(--mono);letter-spacing:-.02em;line-height:1}
.stat-val.acc{color:var(--acc)}
.stat-val.green{color:#4caf50}
.stat-sub{font-size:11px;color:var(--t3);margin-top:6px;font-family:var(--mono)}
.stat-card.accent-card{
  background:linear-gradient(135deg,rgba(var(--acc-rgb),.25),rgba(var(--acc-rgb),.1));
  border-color:rgba(var(--acc-rgb),.25);
}
.stat-card.accent-card .stat-label{color:rgba(255,255,255,.6)}
.stat-card.accent-card .stat-val{color:#fff}
.stat-card.accent-card .stat-sub{color:rgba(255,255,255,.5)}

.pipeline-row{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pipeline-row::-webkit-scrollbar{display:none}
.pipeline-chip{
  flex-shrink:0;
  background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:0.5px solid var(--glass-border);
  border-radius:12px;padding:12px 16px;min-width:90px;
  transition:transform .15s;
}
.pipeline-chip:hover{transform:translateY(-1px)}
.pipe-label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.pipe-val{font-size:20px;font-weight:800;font-family:var(--mono);color:var(--t1)}

.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-ttl{font-size:13px;font-weight:700;letter-spacing:-.01em}
.sec-pill{
  background:var(--surf2);backdrop-filter:blur(10px);
  border:0.5px solid var(--bdr);border-radius:20px;
  padding:3px 10px;font-size:10px;font-family:var(--mono);color:var(--t2);
}

/* ══════════════════════════════
   LEAD CARDS
══════════════════════════════ */
.card-list{display:flex;flex-direction:column;gap:8px}
.lcard{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:0.5px solid var(--glass-border);
  border-radius:16px;overflow:hidden;
  transition:border-color .15s,transform .15s;
}
.lcard:hover{border-color:var(--glass-border2);transform:translateY(-1px)}
.lcard-main{padding:14px 16px}
.lcard-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.lcard-identity{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:var(--mono)}
.av1{background:rgba(232,56,109,.15);color:var(--acc);border:0.5px solid rgba(232,56,109,.2)}
.av2{background:rgba(167,139,250,.15);color:#a78bfa;border:0.5px solid rgba(167,139,250,.2)}
.av3{background:rgba(78,201,176,.15);color:#4ec9b0;border:0.5px solid rgba(78,201,176,.2)}

/* ═══ SPLASH ═══ */
function runSplash(cb){
  const splash=document.getElementById('splash');
  const wordEl=document.getElementById('splash-word');
  const bar=document.getElementById('splash-bar');
  let idx=0;
  const total=HELLOS.length;
  const dur=2800;
  const perWord=dur/total;

  function showNext(){
    if(idx>0){wordEl.classList.remove('visible');wordEl.classList.add('exit')}
    setTimeout(()=>{
      if(idx>=total){
        splash.classList.add('done');
        setTimeout(cb,600);
        return;
      }
      wordEl.textContent=HELLOS[idx].word;
      wordEl.classList.remove('exit');
      void wordEl.offsetWidth;
      wordEl.classList.add('visible');
      bar.style.width=((idx+1)/total*100)+'%';
      idx++;
      setTimeout(showNext,perWord);
    },idx===0?0:180);
  }
  showNext();
}

/* ── PAGES ── */
function renderPage(){
  if(S.tab==='dashboard') return renderDashboard();
  if(S.tab==='creators')  return renderLeads(LIVE_CREATORS[S.vid]||[],'creator');
  if(S.tab==='brands')    return renderLeads(LIVE_BRANDS[S.vid]||[],'brand');
  if(S.tab==='earnings')  return renderEarnings();
  if(S.tab==='bank')      return renderBank();
  if(S.tab==='profile')   return renderProfile();
  return'';
}

/* ── DASHBOARD ── */
function renderDashboard(){
  const v=LIVE_VENDOR[S.vid]||{};
  const allC=LIVE_CREATORS[S.vid]||[];
  const allB=LIVE_BRANDS[S.vid]||[];
  const all=[...allC,...allB];
  const liveDeals=all.filter(r=>r.deal>0);
  const totalDeal=liveDeals.reduce((s,r)=>s+r.deal,0);
  const vendorEarn=S.earningsType==='fixed'?totalDeal:Math.round(totalDeal*S.vendorPct/100);
  const liveCnt=all.filter(r=>r.status==='live').length;
  const pendCnt=all.filter(r=>r.status==='pending'||r.status==='shortlisted').length;
  const pSt=['shortlisted','outreached','negotiation','approved','live'];
  const h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const firstName=v.name?v.name.split(' ')[0]:'Vendor';

  return`
  <div class="dash-greeting">
    <h2>${greet}, ${firstName} 👋</h2>
    <p>Here's a live summary of your leads and earnings.</p>
  </div>
  <div class="stat-grid">
    <div class="stat-card accent-card">
      <div class="stat-label">
        <svg class="stat-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 0 0 7H6"/></svg>
        Your Earnings
      </div>
      <div class="stat-val">${fmt(vendorEarn)}</div>
      <div class="stat-sub">${S.earningsType==='fixed'?'Direct earnings':S.vendorPct+'% commission'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">
        <svg class="stat-svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Total Leads
      </div>
      <div class="stat-val">${all.length}</div>
      <div class="stat-sub">${allC.length} creators · ${allB.length} brands</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">
        <svg class="stat-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Live Now
      </div>
      <div class="stat-val green">${liveCnt}</div>
      <div class="stat-sub">Active campaigns</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">
        <svg class="stat-svg" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        In Pipeline
      </div>
      <div class="stat-val acc">${pendCnt}</div>
      <div class="stat-sub">Awaiting action</div>
    </div>
  </div>
  <div class="sec-hdr"><div class="sec-ttl">Pipeline overview</div></div>
  <div class="pipeline-row">
    ${pSt.map(s=>`<div class="pipeline-chip"><div class="pipe-label">${SL[s]}</div><div class="pipe-val">${all.filter(r=>r.status===s).length}</div></div>`).join('')}
  </div>
  <div class="sec-hdr" style="margin-top:4px"><div class="sec-ttl">Recent activity</div><div class="sec-pill">${all.length} total</div></div>
  <div class="card-list">
    ${all.length===0
      ?`<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>No activity yet. Your leads will appear here.</div>`
      :all.slice(0,3).map((r,i)=>renderCard(r,i,!r.category)).join('')
    }
  </div>
  ${all.length>3?`<div style="text-align:center;margin-top:12px"><button class="btn-s" data-tab="creators">View all creators →</button></div>`:''}`;
}

/* ── LEADS ── */
function renderLeads(rows,type){
  const isC=type==='creator';
  const label=isC?'Creators you referred':'Brands you submitted';
  if(!rows.length) return`
  <div class="sec-hdr"><div class="sec-ttl">${label}</div><div class="sec-pill">0</div></div>
  <div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>Nothing here yet.<br>Contact your Firstskout manager to get started.</div>`;
  return`
  <div class="sec-hdr"><div class="sec-ttl">${label}</div><div class="sec-pill">${rows.length} total</div></div>
  <div class="card-list">${rows.map((r,i)=>renderCard(r,i,isC)).join('')}</div>`;
}

function renderCard(r,i,isC){
  const exp=S.exp[r.id];
  const af=Math.round(r.deal*S.agencyPct/100);
  const vs=Math.round(r.deal*S.vendorPct/100);
  return`
  <div class="lcard">
    <div class="lcard-main">
      <div class="lcard-row1">
        <div class="lcard-identity">
          <div class="av ${avClass(i)}">${ini(r.name)}</div>
          <div>
            <div class="lcard-name">${r.name}</div>
            <div class="lcard-sub">${isC?r.handle:r.category}</div>
            ${isC&&r.model?`<div class="model-tag">${r.model}</div>`:''}
          </div>
        </div>
        <div class="st s-${r.status}"><div class="sd"></div>${SL[r.status]||r.status}</div>
      </div>
      <div class="lcard-row2">
        ${isC?`<div class="lcard-meta-item">Platform <span>${r.platform}</span></div>`:''}
        ${isC?`<div class="lcard-meta-item">Niche <span>${r.niche}</span></div>`:`<div class="lcard-meta-item">Submitted <span>${r.submitted||r.date}</span></div>`}
        <div class="lcard-meta-item">Updated <span>${r.date}</span></div>
      </div>
      ${r.comment?`<div class="lcard-comment">${r.comment}</div>`:''}
      <div class="lcard-footer">
        <div class="lcard-updby">by ${r.updatedBy}</div>
        <button class="lcard-expbtn" data-id="${r.id}">
          <svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5">${exp?'<polyline points="18 15 12 9 6 15"/>':'<polyline points="6 9 12 15 18 9"/>'}</svg>
          ${exp?'Less':'Details'}
        </button>
      </div>
    </div>
    ${exp?`<div class="lcard-expanded">
      <div class="exp-grid">
        <div><div class="ef-l">${isC?'Platform':'Category'}</div><div class="ef-v">${isC?r.platform:r.category}</div></div>
        <div><div class="ef-l">Updated by</div><div class="ef-v">${r.updatedBy}</div></div>
        <div><div class="ef-l">Status</div><div class="ef-v">${SL[r.status]||r.status}</div></div>
        <div><div class="ef-l">Date</div><div class="ef-v">${r.date}</div></div>
        ${r.comment?`<div style="grid-column:1/-1"><div class="ef-l">Comment</div><div class="ef-comment">${r.comment}</div></div>`:''}
      </div>
      ${r.deal>0?`<div class="deal-row">
        ${S.earningsType==='fixed'
          ?`<div style="grid-column:1/-1"><div class="ef-l">Your earnings</div><div class="deal-val g" style="font-size:18px">${fmt(r.deal)}</div></div>`
          :`<div><div class="ef-l">Deal value</div><div class="deal-val n">${fmt(r.deal)}</div></div>
           <div><div class="ef-l">Agency (${S.agencyPct}%)</div><div class="deal-val r">${fmt(af)}</div></div>
           <div><div class="ef-l">Your share (${S.vendorPct}%)</div><div class="deal-val g">${fmt(vs)}</div></div>`
        }
      </div>`:''}
    </div>`:''}
  </div>`;
}

/* ── EARNINGS ── */
function renderEarnings(){
  const all=[...(LIVE_CREATORS[S.vid]||[]),...(LIVE_BRANDS[S.vid]||[])].filter(r=>r.deal>0);
  if(!all.length) return`<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" style="width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 0 0 7H6"/></svg></div>No closed deals yet.<br>Earnings appear here once a campaign goes live.</div>`;
  const td=all.reduce((s,r)=>s+r.deal,0);

  if(S.earningsType==='fixed'){
    return`
    <div class="earn-cards">
      <div class="earn-card"><div class="ec-l">Total earnings</div><div class="ec-v g">${fmt(td)}</div><div class="ec-s">Your total across all deals</div></div>
      <div class="earn-card"><div class="ec-l">Closed deals</div><div class="ec-v n">${all.length}</div><div class="ec-s">Campaigns completed</div></div>
    </div>
    <div class="sec-hdr"><div class="sec-ttl">Deal breakdown</div><div class="sec-pill">${all.length} deal${all.length>1?'s':''}</div></div>
    <div class="earn-table">
      ${all.map(r=>`<div class="earn-row">
        <div class="earn-row-left"><div class="earn-name">${r.name}</div><div class="earn-sub">${r.handle||r.category||''} · ${r.date}</div></div>
        <div class="earn-row-right"><div class="eamt"><div class="eamt-l">Your earnings</div><div class="eamt-v g">${fmt(r.deal)}</div></div></div>
      </div>`).join('')}
    </div>
    <div class="transparency-note">
      <div class="tn-icon"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="tn-text">Your earnings are shown directly for each closed deal. Payouts processed within 7 working days of brand payment clearance.</div>
    </div>`;
  }

  const ta=Math.round(td*S.agencyPct/100);const tv=Math.round(td*S.vendorPct/100);
  return`
  <div class="earn-cards">
    <div class="earn-card"><div class="ec-l">Total deal value</div><div class="ec-v n">${fmt(td)}</div><div class="ec-s">All live campaigns</div></div>
    <div class="earn-card"><div class="ec-l">Agency earnings</div><div class="ec-v r">${fmt(ta)}</div><div class="ec-s">Firstskout fee (${S.agencyPct}%)</div></div>
    <div class="earn-card"><div class="ec-l">Your commission</div><div class="ec-v g">${fmt(tv)}</div><div class="ec-s">Vendor share (${S.vendorPct}%)</div></div>
  </div>
  <div class="sec-hdr"><div class="sec-ttl">Deal breakdown</div><div class="sec-pill">${all.length} deal${all.length>1?'s':''}</div></div>
  <div class="earn-table">
    ${all.map(r=>{const af2=Math.round(r.deal*S.agencyPct/100);const vs2=Math.round(r.deal*S.vendorPct/100);return`
    <div class="earn-row">
      <div class="earn-row-left"><div class="earn-name">${r.name}</div><div class="earn-sub">${r.handle||r.category||''} · ${r.date}</div></div>
      <div class="earn-row-right">
        <div class="eamt"><div class="eamt-l">Agency</div><div class="eamt-v">${fmt(af2)}</div></div>
        <div class="eamt"><div class="eamt-l">Your share</div><div class="eamt-v g">${fmt(vs2)}</div></div>
      </div>
    </div>`;}).join('')}
  </div>
  <div class="transparency-note">
    <div class="tn-icon"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="tn-text">Firstskout is fully transparent with your earnings. All deal values, agency fees and vendor commissions are shown for every closed deal. Payouts processed within 7 working days of brand payment clearance.</div>
  </div>`;
}

    </div>
  </div>
  <div class="settings-card">
    <div class="settings-section-label">Account</div>
    <div class="settings-form" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div>
        <div style="font-size:13px;font-weight:600;margin-bottom:3px">Sign out of FirstVendor</div>
        <div style="font-size:12px;color:var(--t2)">You'll need your Vendor ID and password to sign back in.</div>
      </div>
      <button class="btn-s" id="obtn2" style="flex-shrink:0;color:var(--acc);border-color:rgba(232,56,109,.3)">Sign out</button>
    </div>
  </div>`;
}

/* ══ EVENTS ══ */
function attach(){
  const liId=document.getElementById('li-id');
  const liPw=document.getElementById('li-pw');
  const lbtn=document.getElementById('lbtn');
  const eye=document.getElementById('pw-eye');
  if(lbtn){
    lbtn.onclick=doLogin;
    if(liId){liId.oninput=e=>S.loginId=e.target.value;liId.onkeydown=e=>{if(e.key==='Enter')liPw&&liPw.focus()};setTimeout(()=>liId.focus(),60)}
    if(liPw){liPw.oninput=e=>S.loginPw=e.target.value;liPw.onkeydown=e=>{if(e.key==='Enter')doLogin()}}
    if(eye){eye.onclick=()=>{S.showPw=!S.showPw;render()}}
  }
  document.querySelectorAll('#tbtn').forEach(b=>b.onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applyTheme();render()});
  ['obtn','obtn2'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=signOut});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  const sw=document.getElementById('sync-widget');
  if(sw)sw.onclick=async()=>{S.syncLoading=true;render();await fetchVendorData(S.vid);render()};
  document.querySelectorAll('.lcard-expbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();S.exp[b.dataset.id]=!S.exp[b.dataset.id];render()});
  const edbk=document.getElementById('edbk');if(edbk)edbk.onclick=()=>{S.bankForm={...S.bank};S.bankEdit=true;render()};
  const cnbk=document.getElementById('cnbk');if(cnbk)cnbk.onclick=()=>{S.bankEdit=false;render()};
  const svbk=document.getElementById('svbk');if(svbk)svbk.onclick=saveBank;
  const editPf=document.getElementById('edit-pf');if(editPf)editPf.onclick=()=>{S.profileEdit=true;render()};
  const cancelPf=document.getElementById('cancel-pf');if(cancelPf)cancelPf.onclick=()=>{S.profileEdit=false;render()};
  const savePf=document.getElementById('save-pf');if(savePf)savePf.onclick=saveProfile;
  const savePw=document.getElementById('save-pw');if(savePw)savePw.onclick=savePassword;
}

async function doLogin(){
  const idEl=document.getElementById('li-id');
  const pwEl=document.getElementById('li-pw');
  const id=(idEl?idEl.value:S.loginId).trim().toUpperCase();
  const pw=pwEl?pwEl.value:S.loginPw;
  if(!id){S.loginErr='Please enter your Vendor ID.';render();return}
  if(!pw){S.loginErr='Please enter your password.';render();return}
  const btn=document.getElementById('lbtn');
  if(btn){btn.textContent='Signing in…';btn.disabled=true}
  try{
    const res=await fetch(`${SHEET_URL}?action=login&vendorId=${encodeURIComponent(id)}&password=${encodeURIComponent(pw)}`);
    const data=await res.json();
    if(data.success){
      LIVE_VENDOR[id]=data.vendor;
      if(data.vendor){
        S.earningsType=data.vendor.earningsType||'commission';
        S.agencyPct=data.vendor.agencyPct||(data.settings&&data.settings.agency_fee_pct)||20;
        S.vendorPct=data.vendor.vendorPct||(data.settings&&data.settings.vendor_share_pct)||10;
      }
      S.vid=id;S.screen='app';S.loginErr='';S.exp={};S.tab='dashboard';
      S.bank=null;S.bankEdit=false;S.bankForm={accountName:'',bankName:'',accountNumber:'',ifsc:'',upi:''};
      S.profile={};S.profileEdit=false;S.sync=nt();
      await fetchVendorData(id);
      render();
    } else {
      S.loginErr='Invalid Vendor ID or password.';render();
    }
  } catch(e){S.loginErr='Connection error. Please try again.';render()}
}

async function fetchVendorData(vid){
  try{
    S.syncLoading=true;
    const res=await fetch(`${SHEET_URL}?vendorId=${encodeURIComponent(vid)}`);
    const data=await res.json();
    LIVE_CREATORS[vid]=data.creators||[];
    LIVE_BRANDS[vid]=data.brands||[];
    if(data.settings){S.agencyPct=data.settings.agency_fee_pct||20;S.vendorPct=data.settings.vendor_share_pct||10}
    S.sync=nt();S.syncLoading=false;
  } catch(e){S.syncLoading=false}
}

function signOut(){S.screen='login';S.loginId='';S.loginPw='';S.loginErr='';S.showPw=false;S.exp={};render()}

function saveBank(){
  ['accountName','bankName','accountNumber','ifsc','upi'].forEach(f=>{const el=document.getElementById('bf-'+f);if(el)S.bankForm[f]=el.value.trim()});
  if(!S.bankForm.accountName||!S.bankForm.accountNumber||!S.bankForm.ifsc||!S.bankForm.bankName){alert('Please fill all required fields.');return}
  S.bank={...S.bankForm};S.bankEdit=false;render();
}

function saveProfile(){
  const fields=['pf-name','pf-email','pf-phone','pf-pan'];
  const keys=['name','email','phone','pan'];
  fields.forEach((f,i)=>{const el=document.getElementById(f);if(el)S.profile[keys[i]]=el.value.trim()});
  if(S.profile.pan){
    const panRegex=/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;
    if(S.profile.pan&&!panRegex.test(S.profile.pan.toUpperCase())){alert('Invalid PAN format. Should be like ABCDE1234F');return}
    S.profile.pan=S.profile.pan.toUpperCase();
  }
  S.profileEdit=false;render();
}

function savePassword(){
  const cur=document.getElementById('pw-cur');
  const nw=document.getElementById('pw-new');
  const con=document.getElementById('pw-con');
  const msg=document.getElementById('pw-msg');
  if(!cur||!nw||!con||!msg)return;
  if(!cur.value){msg.style.display='block';msg.style.color='var(--acc)';msg.textContent='Please enter current password.';return}
  if(nw.value.length<6){msg.style.display='block';msg.style.color='var(--acc)';msg.textContent='New password must be at least 6 characters.';return}
  if(nw.value!==con.value){msg.style.display='block';msg.style.color='var(--acc)';msg.textContent='Passwords do not match.';return}
  msg.style.display='block';msg.style.color='#4caf50';msg.textContent='✓ Password change request sent to Firstskout admin.';
  cur.value='';nw.value='';con.value='';
}

/* ══ BOOT ══ */
runSplash(()=>render());
</script>
</body>
</html>
